<meta charset="utf-8" />
<title>Foyer — Complementary Insurance Simulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --bg:#0a0a0f;
    --bg-2:#0f0f17;
    --surface:#14141c;
    --surface-2:#1b1b26;
    --border:#282836;
    --border-soft:#1f1f2b;
    --text:#f1f1f6;
    --text-dim:#9a9aae;
    --text-faint:#848599;
    --accent:#7c6cf6;
    --accent-2:#a78bfa;
    --accent-soft:rgba(124,108,246,0.14);
    --success:#4ade80;
    --warn:#fbbf24;
    --danger:#f87171;
    --radius:14px;
    --radius-sm:9px;
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 600px at 15% -10%, rgba(124,108,246,0.16), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(74,222,128,0.07), transparent 55%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:920px;margin:0 auto;padding:40px 20px 80px;}

  .brand{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg,var(--accent),#4f46e5);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;color:white;flex-shrink:0;
  }
  .brand-name{font-weight:600;font-size:17px;letter-spacing:-0.01em;}
  .brand-sub{color:var(--text-faint);font-size:12.5px;}

  .stepper{display:flex;gap:6px;margin-bottom:32px;}
  .step-pill{
    flex:1;height:4px;border-radius:99px;background:var(--border);overflow:hidden;position:relative;
  }
  .step-pill.done, .step-pill.active{background:var(--accent);}
  .step-labels{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--text-faint);}
  .step-labels span{flex:1;text-align:center;}
  .step-labels span:first-child{text-align:left;}
  .step-labels span:last-child{text-align:right;}
  .step-labels span.current{color:var(--accent-2);font-weight:600;}

  .card{
    background:linear-gradient(180deg, var(--surface), var(--bg-2));
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:28px;
    margin-bottom:20px;
  }
  .card h2{margin:0 0 6px;font-size:20px;letter-spacing:-0.01em;}
  .card .lede{color:var(--text-dim);font-size:13.5px;margin:0 0 22px;}

  label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:500;}
  input[type=text], input[type=date], input[type=number], select{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:var(--radius-sm);
    padding:10px 12px;
    font-size:14px;
    outline:none;
    transition:border-color .15s;
  }
  input:focus, select:focus{border-color:var(--accent);}
  .toggle-btn:focus-visible, .tab:focus-visible, .plan-details summary:focus-visible{
    outline:2px solid var(--accent-2);outline-offset:2px;
  }
  .btn-inline-link{
    background:none;border:none;padding:0;margin-left:4px;color:inherit;text-decoration:underline;
    font-size:inherit;font-weight:600;cursor:pointer;
  }
  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }
  .approx-badge{
    display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;
    color:var(--warn);background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.3);
    border-radius:99px;padding:2px 8px;margin-left:6px;cursor:help;
  }
  input::placeholder{color:var(--text-faint);}
  .field{margin-bottom:16px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media (max-width:640px){.row2,.row3{grid-template-columns:1fr;}}

  .member-card{
    background:var(--surface-2);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-sm);
    padding:18px;
    margin-bottom:14px;
    position:relative;
  }
  .member-card .remove-btn{
    position:absolute;top:14px;right:14px;
    background:none;border:none;color:var(--text-faint);
    cursor:pointer;font-size:12px;padding:4px 8px;border-radius:6px;
  }
  .member-card .remove-btn:hover{color:var(--danger);background:rgba(248,113,113,0.1);}

  .btn{
    display:inline-flex;align-items:center;gap:8px;justify-content:center;
    border-radius:10px;padding:11px 20px;font-size:14px;font-weight:600;
    cursor:pointer;border:1px solid transparent;transition:all .15s;
  }
  .btn-primary{background:var(--accent);color:white;}
  .btn-primary:hover{background:#6b5aef;}
  .btn-primary:disabled{background:var(--surface-2);color:var(--text-faint);cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--text-dim);border-color:var(--border);}
  .btn-ghost:hover{color:var(--text);border-color:var(--accent);}
  .btn-add{
    width:100%;background:transparent;border:1.5px dashed var(--border);color:var(--text-dim);
    padding:12px;border-radius:var(--radius-sm);cursor:pointer;font-size:13.5px;font-weight:500;
  }
  .btn-add:hover{border-color:var(--accent);color:var(--accent-2);}

  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}

  .tabbar{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  .tab{
    padding:8px 14px;border-radius:99px;font-size:13px;cursor:pointer;
    border:1px solid var(--border);color:var(--text-dim);background:var(--surface-2);
  }
  .tab.active{border-color:var(--accent);color:white;background:var(--accent-soft);}

  .toggle-row{display:flex;gap:10px;}
  .toggle-btn{
    flex:1;padding:10px;border-radius:var(--radius-sm);text-align:center;font-size:13.5px;font-weight:500;
    border:1px solid var(--border);color:var(--text-dim);background:var(--surface-2);cursor:pointer;
  }
  .toggle-btn.active{border-color:var(--accent);color:white;background:var(--accent-soft);}

  .plan-checklist{
    background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:14px 16px;max-height:280px;overflow-y:auto;
  }
  .plan-group-label{
    font-size:11px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.03em;
    margin:14px 0 6px;
  }
  .plan-group-label:first-child{margin-top:0;}
  .plan-check-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;}
  @media (max-width:640px){.plan-check-grid{grid-template-columns:1fr;}}
  .plan-check{
    display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);
    padding:4px 2px;cursor:pointer;
  }
  .plan-check:hover{color:var(--text);}
  .plan-check input{flex-shrink:0;accent-color:var(--accent);width:15px;height:15px;cursor:pointer;}

  .disclaimer{
    background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.28);
    border-radius:var(--radius-sm);padding:12px 14px;font-size:12.5px;color:#f3d489;
    margin-bottom:20px;display:flex;gap:10px;align-items:flex-start;
  }
  .disclaimer .ico{flex-shrink:0;font-size:14px;}

  .summary-strip{
    display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px;
  }
  @media (max-width:640px){.summary-strip{grid-template-columns:1fr;}}
  .summary-tile{
    background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius-sm);
    padding:16px;
  }
  .summary-tile .label{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .summary-tile .value{font-size:22px;font-weight:700;letter-spacing:-0.02em;}
  .summary-tile .value.good{color:var(--success);}

  .person-result{
    border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:18px;
    background:linear-gradient(180deg, var(--surface), var(--bg-2));
  }
  .person-result-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .person-name{font-size:16px;font-weight:600;}
  .person-meta{font-size:12px;color:var(--text-faint);}
  .rec-badge{
    display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-2);
    padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:600;border:1px solid rgba(124,108,246,0.3);
  }

  .metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;}
  @media (max-width:640px){.metric-row{grid-template-columns:1fr 1fr;}}
  .metric{background:var(--surface-2);border-radius:var(--radius-sm);padding:12px 14px;}
  .metric .k{font-size:11px;color:var(--text-faint);margin-bottom:4px;}
  .metric .v{font-size:16px;font-weight:700;}

  .breakdown-list{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;}
  .chip{
    font-size:12px;background:var(--surface-2);border:1px solid var(--border-soft);
    padding:5px 10px;border-radius:99px;color:var(--text-dim);
  }
  .chip b{color:var(--text);}

  .savings-note{font-size:13px;padding:10px 12px;border-radius:var(--radius-sm);margin:10px 0;}
  .savings-note.pos{background:rgba(74,222,128,0.08);color:var(--success);border:1px solid rgba(74,222,128,0.25);}
  .savings-note.neg{background:rgba(248,113,113,0.08);color:var(--danger);border:1px solid rgba(248,113,113,0.25);}

  table.tier-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;}
  table.tier-table th, table.tier-table td{
    text-align:left;padding:10px 12px;border-bottom:1px solid var(--border-soft);
  }
  table.tier-table th{color:var(--text-faint);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}
  table.tier-table td.tier-col-highlight, table.tier-table th.tier-col-highlight{
    background:var(--accent-soft);
  }
  .tier-table-wrap{overflow-x:auto;}
  .tier-name{font-weight:600;}
  .tier-recommended-tag{font-size:10px;color:var(--accent-2);display:block;font-weight:600;margin-top:2px;}

  .quote-link{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--accent-2);
    text-decoration:none;margin-top:14px;font-weight:600;
  }
  .quote-link:hover{text-decoration:underline;}

  .restart-row{text-align:center;margin-top:28px;}
  .restart-row button{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:13px;text-decoration:underline;}

  .helptext{font-size:11.5px;color:var(--text-faint);margin-top:4px;}
  .section-title{font-size:13px;font-weight:600;color:var(--text-dim);margin:22px 0 10px;text-transform:uppercase;letter-spacing:.03em;}
  .section-title:first-child{margin-top:0;}

  .candidate-card{
    border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:20px;
    margin-top:16px;background:var(--surface-2);
  }
  .candidate-card.best{
    border:2px solid var(--accent);
    background:linear-gradient(180deg, var(--accent-soft), var(--surface-2));
  }
  .rank-pill{
    font-size:11px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;
    align-self:center;
  }
  .other-options-wrap{opacity:.92;}
  .community-box{
    background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius-sm);
    padding:16px;margin:16px 0;
  }
  .community-box h4{margin:0 0 4px;font-size:13px;}
  .community-box .prelim{font-size:20px;font-weight:700;color:var(--accent-2);margin:6px 0 2px;}
  .status-msg{font-size:12px;margin-top:8px;padding:8px 10px;border-radius:8px;}
  .status-msg.ok{background:rgba(74,222,128,0.08);color:var(--success);border:1px solid rgba(74,222,128,0.25);}
  .status-msg.err{background:rgba(248,113,113,0.08);color:var(--danger);border:1px solid rgba(248,113,113,0.25);}
  .status-msg.info{background:rgba(124,108,246,0.08);color:var(--accent-2);border:1px solid rgba(124,108,246,0.25);}
  .btn-sm{padding:8px 14px;font-size:13px;}

  .plan-details{margin-top:16px;border-top:1px solid var(--border-soft);padding-top:14px;}
  .plan-details summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--accent-2);}
  .plan-details summary:hover{color:var(--text);}
  .detail-note{font-size:12.5px;color:var(--text-dim);line-height:1.6;margin:12px 0 0;}
  .detail-group-label{font-size:11px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.03em;margin:12px 0 6px;}
  .detail-plan-list{display:flex;flex-wrap:wrap;gap:6px;}

  @media print{
    :root{
      --bg:#ffffff; --bg-2:#ffffff; --surface:#ffffff; --surface-2:#f4f4f7;
      --border:#d6d6e0; --border-soft:#e6e6ee; --text:#16161f; --text-dim:#3f3f52;
      --text-faint:#65657a; --accent:#5b4fd6; --accent-2:#4c3fc7; --accent-soft:#eeecfd;
      --success:#1a7d43; --warn:#92620a; --danger:#b02a2a;
    }
    body{background:#fff;}
    .no-print, .stepper, .step-labels, .nav-row, .restart-row{display:none !important;}
    .person-result, .candidate-card{break-inside:avoid;page-break-inside:avoid;}
    .plan-details summary{display:none;}
    a{color:var(--accent-2);text-decoration:underline;}
    /* #app's 920px max-width and .tier-table-wrap's horizontal scrollbar
       are screen-only affordances — print has no scrollbar, so a 4-column
       table (label + 3 insurers, often long French/German plan names)
       would otherwise clip against that fixed width instead of using the
       full printable page. */
    #app{max-width:none;padding:0 8px;}
    .tier-table-wrap{overflow-x:visible;}
    table.tier-table{font-size:10.5px;table-layout:fixed;width:100%;}
    table.tier-table th, table.tier-table td{padding:6px 7px;word-break:break-word;}
    table.tier-table td:first-child, table.tier-table th:first-child{width:22%;}
  }
</style>

<div id="app"></div>
<div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------------------

   * spelled out per tier), that's noted in the tier's `note`.

   * Premiums are intentionally NOT modeled: Swiss LCA premiums depend on
   * age, canton and underwriting, and none of these insurers expose a
   * public pricing API. The results page links straight to each
   * insurer's own calculator instead of guessing a number.

  var INSURERS = [
    {
      id: "groupe-mutuel", name: "Groupe Mutuel", url: "https://www.groupemutuel.ch",

          "SD Soins complémentaires Premium", "SO Soins complémentaires Optimum", "SA Soins Alterna", "SP Assurance Vitalis"
        ] },
        { group: "Hospitalisation", items: [
          "HC Hospitalisation Niveau 1", "HC Hospitalisation Niveau 2", "HC Hospitalisation Niveau 3", "HC Hospitalisation Niveau 4",
          "HB Hospitalisation H-Bonus", "HS Hôpital senior Classe 1", "HS Hôpital senior Classe 2", "HS Hôpital senior Classe 3", "HS Hôpital senior Classe 4",
          "KH H-Capital", "BH Indemnité journalière hospitalisation"
        ] },
        { group: "Voyage & assistance à l'étranger", items: ["MU Mundo"] },

      ],

        { tier: "Niveau 2", planName: "Global smart Niveau 2",

          hospitalComfort: "general", maternity: { amount: 0 },

      ]
    },
    {
      id: "helsana", name: "Helsana", url: "https://www.helsana.ch",
      sourced: true, sourceLabel: "Assurances complémentaires ambulatoires brochure, édition 2025/26",
      knownPlanGroups: [
        { group: "Ambulatoire", items: ["TOP", "SANA", "COMPLETA", "COMPLETA PLUS", "PRIMEO"] },
        { group: "Hospitalisation (produit séparé, non détaillé dans nos documents)", items: ["HOSPITAL"] }
      ],
      tiers: [
        { tier: "Essential", planName: "TOP",
          altMed: { percent: 0, cap: 0 },
          glasses: { percent: 90, amount: 150, periodYears: 1 }, gym: { percent: 0, cap: 0 },
          hospitalComfort: "general", maternity: { amount: 0 },
          note: "TOP's real focus is orthodontics/eyewear/travel, not alternative medicine or fitness — the brochure doesn't itemize those for TOP. Hospital ward comfort (Helsana's separate HOSPITAL product) isn't in this document set." },
        { tier: "Balanced", planName: "COMPLETA",
          altMed: { percent: 75, cap: 20000 },

        { tier: "Premium", planName: "COMPLETA + COMPLETA PLUS",
          altMed: { percent: 90, cap: 20000 },
          glasses: { percent: 90, amount: 500, periodYears: 1 }, gym: { percent: 75, cap: 400 },
          hospitalComfort: "general", maternity: { amount: 500 },
          approx: true,
          note: "COMPLETA PLUS is an add-on sold only in combination with COMPLETA — figures here are the two products' benefits combined. Complementary medicine is genuinely layered (COMPLETA's 75% outpatient reimbursement is uncapped; COMPLETA PLUS adds a further 15% up to CHF 500/yr on top of that) — approximated here as a flat 90%, uncapped. The CHF 500/yr pregnancy sub-cap is the same one COMPLETA already provides; COMPLETA PLUS doesn't add a pregnancy-specific increment, which is why it's identical to Balanced's." }

          hospitalComfort: "general", maternity: { amount: 1000 },
          approx: true,
          note: "myFlex bundles 3 separate products (Ambulatoire, Hospitalisation, Médecine alternative myFlex); this row combines their Economy levels. Hospital ward (general/semi-private/private) isn't tabulated per tier in the brochure — inferred from CSS's own “choose your comfort level” marketing copy." },
        { tier: "Balance", planName: "myFlex Balance",
          altMed: { percent: 75, cap: 3000 },
          glasses: { percent: 100, amount: 150, periodYears: 1 }, gym: { percent: 50, cap: 500 },
          hospitalComfort: "semi-private", maternity: { amount: 1500 },
          approx: true,
          note: "Hospital ward inferred (see Economy note)." },
        { tier: "Premium", planName: "myFlex Premium",
          altMed: { percent: 75, cap: 10000 },
          glasses: { percent: 100, amount: 300, periodYears: 1 }, gym: { percent: 50, cap: 700 },
          hospitalComfort: "private", maternity: { amount: 2000 },

  function computeAge(birthDateStr){
    if (!birthDateStr) return null;
    var b = new Date(birthDateStr);
    if (isNaN(b.getTime())) return null;
    var today = new Date();
    var age = today.getFullYear() - b.getFullYear();
    var m = today.getMonth() - b.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < b.getDate())) age--;
    return age;
  }

  function ageBand(age){
    if (age === null) return "adult";
    if (age < 18) return "child";
    if (age >= 65) return "senior";
    return "adult";
  }

  // Real Swiss LCA premiums are age-rated far more finely than child/adult/
  // senior — Groupe Mutuel's own Global smart conditions (GOGA03-E1, Art. 9)
  // state their actual rating groups as: 0–18, 19–25, then five-year
  // brackets from 26 to 85, then 86+. Used only for bucketing community-
  // reported premiums (a finer bucket means a more comparable median);
  // ageBand() above is unrelated and still drives the pregnancy-question
  // gating, which only needs the coarser child/adult distinction.
  function pricingAgeBand(age){
    if (age === null) return "unknown";
    if (age <= 18) return "0-18";
    if (age <= 25) return "19-25";
    if (age <= 85){
      var start = 26 + Math.floor((age - 26) / 5) * 5;
      return start + "-" + (start + 4);
    }
    return "86+";
  }
