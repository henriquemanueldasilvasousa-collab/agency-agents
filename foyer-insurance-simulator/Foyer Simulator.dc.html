          approx: true,
          note: "Alt-medicine cap approximated the same way as TOP, at Forte's CHF 120/hour rate." },
        { tier: "Forte + Hospita Privée", planName: "COMPLETA FORTE + HOSPITA PRIVÉE",
          altMed: { percent: 100, cap: 2400 },
          glasses: { amount: 900, periodYears: 3 }, gym: { percent: 90, cap: 800 },
          hospitalComfort: "private", maternity: { amount: 650 }, travel: true,
          approx: true,
          note: "Represents COMPLETA FORTE combined with Swica's separate Hospita Privée hospital product, as households commonly buy them together — inherits Forte's approximated alt-medicine cap." }
      ]
    },
    {
      id: "atupri", name: "Atupri", url: "https://www.atupri.ch",
      sourced: false, sourceLabel: "No official Atupri documents supplied yet — figures are estimates from public web research, not verified against a fiche/CGA",
      tiers: [
        { tier: "Basic", planName: "Basic",
          altMed: { percent: 0, cap: 0 },
          glasses: { amount: 0, periodYears: 1 }, gym: { percent: 75, cap: 200 },
          hospitalComfort: "general", maternity: { amount: 0 }, travel: true, note: "Estimate, unverified." },
        { tier: "Mivita Reala", planName: "Mivita Reala",
          altMed: { percent: 50, cap: 1500 },
          glasses: { amount: 0, periodYears: 1 }, gym: { percent: 50, cap: 300 },
          hospitalComfort: "general", maternity: { amount: 300 }, travel: true, note: "Estimate, unverified." },
        { tier: "Intense", planName: "Intense",
          altMed: { percent: 50, cap: 1500 },
          glasses: { amount: 350, periodYears: 1 }, gym: { percent: 50, cap: 300 },
          hospitalComfort: "general", maternity: { amount: 1000 }, travel: true, note: "Estimate, unverified." }
      ]
    }
  ];

  var COMFORT_RANK = { "general": 0, "semi-private": 1, "private": 2 };
  var COMFORT_LABEL = { "general": "General ward", "semi-private": "Semi-private ward", "private": "Private ward" };

  /* ------------------------------ helpers ------------------------------ */

  function uid(){ return Math.random().toString(36).slice(2, 10); }

  function computeAge(birthDateStr){
    if (!birthDateStr) return null;
    var b = new Date(birthDateStr);
    if (isNaN(b.getTime())) return null;
    var today = new Date();
    var age = today.getFullYear() - b.getFullYear();
    var m = today.getMonth() - b.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < b.getDate())) age--;
    return age;
  }

  function ageBand(age){
    if (age === null) return "adult";
    if (age < 18) return "child";
    if (age >= 65) return "senior";
    return "adult";
  }

  function chf(n){
    var v = Math.round(n);
    return "CHF " + v.toLocaleString("de-CH");
  }

  // Chromium (and most browsers) throw on setSelectionRange() for
  // type="number" inputs, so the cursor-restore trick used elsewhere
  // silently fails on them and every keystroke lands at position 0.
  // These fields use type="text" + inputmode="decimal" instead, with this
  // sanitizer keeping only digits and a single decimal point.
  function sanitizeDecimal(raw){
    var s = String(raw == null ? "" : raw).replace(/[^\d.]/g, "");
    var firstDot = s.indexOf(".");
    if (firstDot !== -1) s = s.slice(0, firstDot + 1) + s.slice(firstDot + 1).replace(/\./g, "");
    return s;
  }

  function regionFromPostal(code){
    if (!/^\d{4}$/.test(code || "")) return "";
    var n = parseInt(code, 10);
    // Checked before the first-digit fallback below — Switzerland's ~4000
    // real postal codes have plenty of cross-canton exceptions a single
    // leading digit can't capture, and these were the biggest, most visible
    // misses: all of Ticino (Lugano 6900, Chiasso 6830, Mendrisio 6850, …)
    // was falling into "LU-Zentralschweiz", Valais and Fribourg were both
    // swallowed by "VD", and Schaffhausen/Thurgau were swallowed by "ZH".
    // Still an approximation, just a much smaller one.
    if (n >= 6500 && n <= 6999) return "TI";
    if ((n >= 1870 && n <= 1999) || (n >= 3900 && n <= 3999)) return "VS";
    if (n >= 1630 && n <= 1799) return "FR";
    if (n >= 8200 && n <= 8265) return "SH";
    if ((n >= 8500 && n <= 8599) || (n >= 9400 && n <= 9499)) return "TG";
    if (code.slice(0, 2) === "12") return "GE";
    var d = code.charAt(0);
    if (d === "1") return "VD";
    if (d === "2") return "NE-JU-BE";
    if (d === "3") return "BE";
    if (d === "4") return "BS-BL-SO";
    if (d === "5") return "AG";
    if (d === "6") return "LU-Zentralschweiz";
    if (d === "7") return "GR";
    if (d === "8") return "ZH";
    if (d === "9") return "SG-Ostschweiz";
    return "";
  }

  /* ---------------------------- calc engine ----------------------------- */

  // The glasses question asks for total spend over the next 2 years, a
  // fixed window independent of any plan. Comparing plans by dividing that
  // one-time purchase by EACH PLAN'S OWN cap-reset cadence (1yr vs 3yr)
  // silently rewarded annual-reset plans ~3x for reimbursing the exact same
  // CHF amount on the exact same purchase — that's what was pushing
  // Helsana (all 1yr resets) artificially far ahead of insurers whose
  // glasses cap resets every 3yr, even when both fully cover the spend.
  // Normalizing against this fixed window instead compares plans on the
  // actual purchase, not on how often their clock happens to tick.
  var GLASSES_WINDOW_YEARS = 2;

  // Free-typed spend fields are sanitized strings (see sanitizeDecimal), and
  // a value like "." is a valid intermediate typing state that's truthy but
  // not a number — `|| 0` doesn't catch it, so it was propagating NaN into
  // every reimbursement figure. Coerce through this instead of `|| 0`.
  function numOr0(v){
    var n = parseFloat(v);
    return isNaN(n) ? 0 : n;
  }

  function computeReimbursement(needs, tier){
    var breakdown = {};
    var altMedSpend = numOr0(needs.altMedSpend);
    breakdown.altMed = Math.min(altMedSpend * tier.altMed.percent / 100, tier.altMed.cap);

    var glassesSpend = numOr0(needs.glassesSpend);
    var glassesReimbPeriod = glassesSpend > 0 ? Math.min(glassesSpend, tier.glasses.amount) : 0;
    breakdown.glasses = glassesReimbPeriod / GLASSES_WINDOW_YEARS;

    var gymSpend = numOr0(needs.gymSpend);
    breakdown.gym = gymSpend > 0 ? Math.min(gymSpend * tier.gym.percent / 100, tier.gym.cap) : 0;

    breakdown.maternity = needs.pregnancy ? tier.maternity.amount : 0;

    var total = breakdown.altMed + breakdown.glasses + breakdown.gym + breakdown.maternity;
    return { total: total, breakdown: breakdown };
  }

  function gateCheck(tier, needs){
    var comfortOk = COMFORT_RANK[tier.hospitalComfort] >= COMFORT_RANK[needs.comfortPref];
    return { comfortOk: comfortOk, passes: comfortOk };
  }

  function recommendForPerson(member, needs){
    var age = computeAge(member.birthDate);
    var band = ageBand(age);
    var candidates = [];

    INSURERS.forEach(function(insurer){
      insurer.tiers.forEach(function(tier, idx){
        var gate = gateCheck(tier, needs);
        var reimb = computeReimbursement(needs, tier);
        candidates.push({
          insurerId: insurer.id,
          insurerName: insurer.name,
          insurerUrl: insurer.url,
          insurerSourced: insurer.sourced,
          insurerSourceLabel: insurer.sourceLabel,
          tierIndex: idx,
          tierLabel: tier.tier,
          planName: tier.planName,
          tierData: tier,
          reimbursement: reimb.total,
          breakdown: reimb.breakdown,
          passes: gate.passes,
          gate: gate
        });
      });
    });

    candidates.sort(function(a, b){
      if (b.gate.passes !== a.gate.passes) return b.gate.passes ? 1 : -1;
      return b.reimbursement - a.reimbursement;
    });

    // Reduce to each insurer's single best-matching tier, then rank
    // insurers against each other — three DIFFERENT companies to compare
    // real quotes across, rather than three tiers of the same one.
    var bestPerInsurer = {};
    candidates.forEach(function(c){
      var incumbent = bestPerInsurer[c.insurerId];
      if (!incumbent) { bestPerInsurer[c.insurerId] = c; return; }
      if ((c.gate.passes && !incumbent.gate.passes) || (c.gate.passes === incumbent.gate.passes && c.reimbursement > incumbent.reimbursement)){
        bestPerInsurer[c.insurerId] = c;
      }
    });
    var rankedInsurers = INSURERS.map(function(i){ return bestPerInsurer[i.id]; }).filter(Boolean);
    rankedInsurers.sort(function(a, b){
      if (b.gate.passes !== a.gate.passes) return b.gate.passes ? 1 : -1;
      return b.reimbursement - a.reimbursement;
    });
    var top3 = rankedInsurers.slice(0, 3);
    var best = top3[0];

    return { best: best, top3: top3, band: band, age: age, fullMatch: best.passes };
  }

  /* ------------------------- community pricing (Drive) -------------------------
   * Real premiums people report on the results page are saved to a Google
   * Sheet per insurer (via the viewer's own Google Drive connector,
   * window.claude.mcp) in a "Foyer Simulator Data" folder. There is no
   * update/append tool on this connector — every save reads the newest
   * existing sheet for that insurer, appends the new row in memory, and
   * writes a brand-new CSV file with the same title; the most recently
   * modified file with that title is treated as the live sheet. Older
   * versions are harmless clutter, not errors.
   * ------------------------------------------------------------------- */

  var DRIVE_SERVER = "Google Drive";
  var DATA_FOLDER_NAME = "Foyer Simulator Data";
  var PRELIM_THRESHOLD = 3;
  var CSV_COLUMNS = ["timestamp", "insurerId", "tier", "planName", "ageBand", "sex", "region", "postalCode", "monthlyPremiumCHF"];

  var driveFolderIdPromise = null;

  function mcpAvailable(){
    return typeof window !== "undefined" && !!(window.claude && window.claude.mcp);
  }

  function driveSheetTitle(insurer){
    return "Foyer Data — " + insurer.name;
  }

  // RFC4180-style quoting. The underlying Google Sheet is manually
  // editable by anyone in the community — a plain comma-strip on write
  // doesn't help if someone later types a comma directly into a cell in
  // Sheets, which would silently shift every column after it for a naive
  // split(","). Quote fields that need it on write, and parse quotes
  // properly on read so a stray comma in one cell can't corrupt others'.
  function csvEscape(v){
    var s = String(v == null ? "" : v);
    if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function rowsToCsv(rows){
    var lines = [CSV_COLUMNS.join(",")];
    rows.forEach(function(r){
      lines.push(CSV_COLUMNS.map(function(c){ return csvEscape(r[c]); }).join(","));
    });
    return lines.join("\r\n");
  }

  function csvToRows(text){
    var raw = String(text || "");
    if (!raw) return [];
    var rows = [];
    var row = [];
    var cur = "";
    var inQuotes = false;
    for (var i = 0; i < raw.length; i++){
      var ch = raw[i];
      if (inQuotes){
        if (ch === '"'){
          if (raw[i + 1] === '"'){ cur += '"'; i++; }
          else inQuotes = false;
        } else {
          cur += ch;
        }
      } else if (ch === '"'){
        inQuotes = true;
      } else if (ch === ","){
        row.push(cur); cur = "";
      } else if (ch === "\r"){
        // ignored — the following \n (or end of text) terminates the row
      } else if (ch === "\n"){
        row.push(cur); cur = "";
        rows.push(row); row = [];
      } else {
        cur += ch;
      }
    }
    if (cur.length > 0 || row.length > 0){ row.push(cur); rows.push(row); }
    rows = rows.filter(function(r){ return !(r.length === 1 && r[0] === ""); });
    if (rows.length < 2) return [];
    var header = rows[0];
    return rows.slice(1).map(function(cells){
      var row2 = {};
      header.forEach(function(h, i){ row2[h] = cells[i] || ""; });
      return row2;
    });
  }

  function b64DecodeUtf8(b64){
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }

  function getDataFolderId(){
    if (driveFolderIdPromise) return driveFolderIdPromise;
    driveFolderIdPromise = window.claude.mcp.callTool(DRIVE_SERVER, "search_files", {
      query: "title = '" + DATA_FOLDER_NAME + "' and mimeType = 'application/vnd.google-apps.folder'"
    }).then(function(res){
      var files = (res.payload && res.payload.files) || [];
      if (files.length) return files[0].id;
      return window.claude.mcp.callTool(DRIVE_SERVER, "create_file", {
        title: DATA_FOLDER_NAME,
        contentMimeType: "application/vnd.google-apps.folder"
      }).then(function(r2){ return r2.payload.id; });
    }).catch(function(err){
      driveFolderIdPromise = null;
      throw err;
    });
    return driveFolderIdPromise;
  }

  function loadInsurerRows(insurerId){
    var insurer = INSURERS.filter(function(i){ return i.id === insurerId; })[0];
    if (!insurer) return Promise.resolve({ rows: [] });
    return getDataFolderId().then(function(folderId){
      return window.claude.mcp.callTool(DRIVE_SERVER, "search_files", {
        query: "parentId = '" + folderId + "' and title = '" + driveSheetTitle(insurer) + "'"
      }, { cache: { staleTime: 30000 } }).then(function(res){
        var files = (res.payload && res.payload.files) || [];
        if (!files.length) return { folderId: folderId, rows: [] };
        files.sort(function(a, b){ return new Date(b.modifiedTime) - new Date(a.modifiedTime); });
        var latest = files[0];
        return window.claude.mcp.callTool(DRIVE_SERVER, "download_file_content", {
          fileId: latest.id, exportMimeType: "text/csv"
        }).then(function(dl){
          var csv = b64DecodeUtf8(dl.payload.content);
          return { folderId: folderId, rows: csvToRows(csv) };
        });
      });
    });
  }

  function saveQuoteRow(insurerId, row){
    var insurer = INSURERS.filter(function(i){ return i.id === insurerId; })[0];
    if (!insurer) return Promise.reject(new Error("Unknown insurer"));
    return loadInsurerRows(insurerId).then(function(existing){
      var rows = existing.rows.concat([row]);
      var csv = rowsToCsv(rows);
      return window.claude.mcp.callTool(DRIVE_SERVER, "create_file", {
        title: driveSheetTitle(insurer),
        parentId: existing.folderId,
        contentMimeType: "text/csv",
        textContent: csv
      }, { cache: false }).then(function(){
        return rows;
      });
    });
  }

  function computePreliminary(rows, insurerId, tierLabel, ageBand, region){
    var matches = rows.filter(function(r){
      return r.insurerId === insurerId && r.tier === tierLabel && r.ageBand === ageBand && r.region === region;
    });
    var premiums = matches.map(function(r){ return parseFloat(r.monthlyPremiumCHF); }).filter(function(n){ return !isNaN(n) && n > 0; });
    if (premiums.length < PRELIM_THRESHOLD) return null;
    premiums.sort(function(a, b){ return a - b; });
    var mid = Math.floor(premiums.length / 2);
    var median = premiums.length % 2 ? premiums[mid] : (premiums[mid - 1] + premiums[mid]) / 2;
    return { median: median, count: premiums.length };
  }

  /* -------------------------------- state -------------------------------- */

  function newMember(name){
    return { id: uid(), name: name || "", birthDate: "", sex: "" };
  }

  function defaultState(){
    var m1 = newMember("");
    var m2 = newMember("");
    var coverage = {};
    var needs = {};
    [m1, m2].forEach(function(m){
      coverage[m.id] = { hasComplementary: false, insurerId: "", planNames: [], monthlyPremium: "" };
      needs[m.id] = {
        gymSpend: 0, glassesSpend: 0, altMedSpend: 0,
        comfortPref: "general", pregnancy: false, travelFrequency: "rarely"
      };
    });
    return {
      step: 1,
      household: { postalCode: "", members: [m1, m2] },
      coverage: coverage,
      needs: needs,
      activeTab: { 2: m1.id, 3: m1.id },
      community: {},
      quoteForm: {}
    };
  }

  var state = defaultState();

  function ensureMemberData(id){
    if (!state.coverage[id]) state.coverage[id] = { hasComplementary: false, insurerId: "", planNames: [], monthlyPremium: "" };
    if (!state.needs[id]) state.needs[id] = {
      gymSpend: 0, glassesSpend: 0, altMedSpend: 0,
      comfortPref: "general", pregnancy: false, travelFrequency: "rarely"
    };
    if (!state.quoteForm[id]) state.quoteForm[id] = {};
  }

  // Quote-form state is member -> insurerId -> entry, since each of the
  // top-3 candidate cards (possibly 3 different insurers) needs its own
  // independent save form.
  function ensureQuoteFormEntry(memberId, insurerId, defaultTier){
    if (!state.quoteForm[memberId]) state.quoteForm[memberId] = {};
    if (!state.quoteForm[memberId][insurerId]){
      state.quoteForm[memberId][insurerId] = { tier: defaultTier, premium: "", status: "idle", errorCode: "" };
    }
    return state.quoteForm[memberId][insurerId];
  }

  function ensureCommunityLoaded(insurerId){
    if (!state.community[insurerId]) state.community[insurerId] = { status: "idle", rows: [], errorCode: "" };
    var c = state.community[insurerId];
    if (c.status === "idle" && mcpAvailable()){
      c.status = "loading";
      loadInsurerRows(insurerId).then(function(res){
        c.status = "loaded";
        c.rows = res.rows;
        render();
      }).catch(function(err){
        c.status = "error";
        c.errorCode = (err && err.code) || "upstream_error";
        render();
      });
    }
  }

  /* -------------------------------- render -------------------------------- */

  var STEP_LABELS = ["Household", "Coverage", "Needs", "Results"];

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Populated by renderPersonResult() during a step-4 render, then flushed
  // to the persistent #live-region node below — see the comment at its
  // call site for why this can't just be inline markup.
  var pendingLiveAnnouncement = "";

  function render(){
    var app = document.getElementById("app");
    var html = "";
    pendingLiveAnnouncement = "";
    html += renderBrand();
    html += renderStepper();
    if (state.step === 1) html += renderStep1();
    else if (state.step === 2) html += renderStep2();
    else if (state.step === 3) html += renderStep3();
    else if (state.step === 4) html += renderStep4();
    app.innerHTML = html;
    attachHandlers();
    var liveRegion = document.getElementById("live-region");
    if (liveRegion) liveRegion.textContent = pendingLiveAnnouncement;
  }

  function renderBrand(){
    return (
      '<div class="brand">' +
        '<div class="brand-mark">F</div>' +
        '<div>' +
          '<div class="brand-name">Foyer</div>' +
          '<div class="brand-sub">Complementary insurance simulator</div>' +
        '</div>' +
      '</div>'
    );
  }

  function renderStepper(){
    var pills = "";
    var labels = "";
    for (var i = 1; i <= 4; i++){
      var cls = i < state.step ? "done" : (i === state.step ? "active" : "");
      pills += '<div class="step-pill ' + cls + '"></div>';
    }
    STEP_LABELS.forEach(function(label, idx){
      var n = idx + 1;
      labels += '<span class="' + (n === state.step ? "current" : "") + '">' + label + '</span>';
    });
    return '<div class="stepper">' + pills + '</div><div class="step-labels">' + labels + '</div>';
  }

  /* --------- Step 1: household --------- */

  function isStep1Valid(){
    var h = state.household;
    if (!/^\d{4}$/.test(h.postalCode)) return false;
    if (h.members.length === 0) return false;
    return h.members.every(function(m){ return m.name.trim().length > 0 && m.birthDate && m.sex; });
  }

  function renderStep1(){
    var h = state.household;
    var membersHtml = h.members.map(function(m, idx){
      var removeBtn = h.members.length > 1
        ? '<button class="remove-btn" data-action="remove-member" data-id="' + m.id + '">Remove</button>'
        : "";
      var sexOptions = [["", "Select…"], ["f", "Female"], ["m", "Male"]].map(function(o){
        return '<option value="' + o[0] + '" ' + (m.sex === o[0] ? "selected" : "") + '>' + o[1] + '</option>';
      }).join("");
      return (
        '<div class="member-card">' +
          removeBtn +
          '<div class="row3">' +
            '<div class="field">' +
              '<label for="member-name-' + m.id + '">Full name</label>' +
              '<input id="member-name-' + m.id + '" type="text" placeholder="e.g. Alex Meier" value="' + esc(m.name) + '" data-action="member-name" data-id="' + m.id + '" />' +
            '</div>' +
            '<div class="field">' +
              '<label for="member-birthdate-' + m.id + '">Date of birth</label>' +
              '<input id="member-birthdate-' + m.id + '" type="date" value="' + esc(m.birthDate) + '" max="' + todayISO() + '" data-action="member-birthdate" data-id="' + m.id + '" />' +
            '</div>' +
            '<div class="field">' +
              '<label for="member-sex-' + m.id + '">Sex</label>' +
              '<select id="member-sex-' + m.id + '" data-action="member-sex" data-id="' + m.id + '">' + sexOptions + '</select>' +
              '<div class="helptext">Required by insurers\' own premium calculators.</div>' +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }).join("");

    return (
      '<div class="card">' +
        '<h2>Your household</h2>' +
        '<p class="lede">Everyone at the same address shares one postal code. Date of birth and sex are what each insurer\'s own calculator needs for a real premium — we\'ll show them back to you on the results page to enter there.</p>' +
        '<div class="field" style="max-width:200px;">' +
          '<label for="postal-code">Postal code (NPA / PLZ)</label>' +
          '<input id="postal-code" type="text" inputmode="numeric" maxlength="4" placeholder="1000" value="' + esc(h.postalCode) + '" data-action="postal-code" />' +
        '</div>' +
        '<div class="section-title">Members</div>' +
        membersHtml +
        (h.members.length < 8 ? '<button class="btn-add" data-action="add-member">+ Add another household member</button>' : "") +
      '</div>' +
      '<div class="nav-row">' +
        '<span></span>' +
        '<button class="btn btn-primary" data-action="next" ' + (isStep1Valid() ? "" : "disabled") + '>Continue</button>' +
      '</div>'
    );
  }

  function todayISO(){
    var d = new Date();
    return d.toISOString().slice(0, 10);
  }

  /* --------- Step 2: current coverage --------- */

  function renderMemberTabs(step){
    var h = state.household;
    return '<div class="tabbar" role="tablist">' + h.members.map(function(m){
      var active = state.activeTab[step] === m.id;
      var label = m.name.trim() || "Member";
      return '<div class="tab ' + (active ? "active" : "") + '" role="tab" aria-selected="' + active + '" tabindex="0" data-action="tab" data-step="' + step + '" data-id="' + m.id + '">' + esc(label) + '</div>';
    }).join("") + '</div>';
  }

  function currentTabMember(step){
    var h = state.household;
    var id = state.activeTab[step];
    var m = h.members.filter(function(x){ return x.id === id; })[0];
    return m || h.members[0];
  }

  function renderStep2(){
    var m = currentTabMember(2);
    ensureMemberData(m.id);
    var c = state.coverage[m.id];

    var insurerOptions = '<option value="">Select insurer…</option>' + INSURERS.map(function(ins){
      return '<option value="' + ins.id + '" ' + (c.insurerId === ins.id ? "selected" : "") + '>' + ins.name + '</option>';
    }).join("") + '<option value="other" ' + (c.insurerId === "other" ? "selected" : "") + '>Other / not sure</option>';

    var knownInsurer = INSURERS.filter(function(i){ return i.id === c.insurerId; })[0];
    var planFieldHtml;
    if (knownInsurer){
      // Checkboxes, not a single select — real households commonly stack
      // several of an insurer's products at once (e.g. a Global family plan
      // GL/GO/GC plus a standalone Mundo travel rider and/or Dentaire plus).
      var planGroups = knownInsurer.knownPlanGroups || [{
        group: "",
        items: knownInsurer.tiers.map(function(t){ return t.tier + " — " + t.planName; })
      }];
      var checklistHtml = planGroups.map(function(g){
        var itemsHtml = g.items.map(function(label){
          var checked = c.planNames.indexOf(label) !== -1 ? "checked" : "";
          return (
            '<label class="plan-check">' +
              '<input type="checkbox" data-action="cov-plan-toggle" data-id="' + m.id + '" data-value="' + esc(label) + '" ' + checked + ' />' +
              '<span>' + esc(label) + '</span>' +
            '</label>'
          );
        }).join("");
        return (g.group ? '<div class="plan-group-label">' + esc(g.group) + '</div>' : "") + '<div class="plan-check-grid">' + itemsHtml + '</div>';
      }).join("");
      planFieldHtml = '<div class="plan-checklist" role="group" aria-labelledby="cov-plan-label-' + m.id + '">' + checklistHtml + '</div>';
    } else {
      planFieldHtml = '<input id="cov-plan-text-' + m.id + '" type="text" placeholder="e.g. COMPLETA" value="' + esc(c.planNames[0] || "") + '" data-action="cov-plan-text" data-id="' + m.id + '" />';
    }

    return (
      '<div class="card">' +
        '<h2>Current coverage</h2>' +
        '<p class="lede">Tell us what each person already has, if anything. This lets us estimate potential savings.</p>' +
        renderMemberTabs(2) +
        '<div class="toggle-row" style="margin-bottom:18px;" role="radiogroup" aria-label="Complementary insurance status">' +
          '<div class="toggle-btn ' + (c.hasComplementary ? "" : "active") + '" role="radio" aria-checked="' + (!c.hasComplementary) + '" tabindex="0" data-action="cov-has" data-id="' + m.id + '" data-value="false">No complementary insurance</div>' +
          '<div class="toggle-btn ' + (c.hasComplementary ? "active" : "") + '" role="radio" aria-checked="' + c.hasComplementary + '" tabindex="0" data-action="cov-has" data-id="' + m.id + '" data-value="true">Has complementary insurance</div>' +
        '</div>' +
        (c.hasComplementary ? (
          '<div class="field">' +
            '<label for="cov-insurer-' + m.id + '">Current insurer</label>' +
            '<select id="cov-insurer-' + m.id + '" data-action="cov-insurer" data-id="' + m.id + '" style="max-width:320px;">' + insurerOptions + '</select>' +
          '</div>' +
          '<div class="field">' +
            '<label id="cov-plan-label-' + m.id + '"' + (knownInsurer ? '' : ' for="cov-plan-text-' + m.id + '"') + '>Plan(s) held' + (knownInsurer ? ' — select all that apply' : '') + '</label>' +
            planFieldHtml +
          '</div>' +
          '<div class="field" style="max-width:220px;">' +
            '<label for="cov-premium-' + m.id + '">Total monthly premium (CHF)</label>' +
            '<input id="cov-premium-' + m.id + '" type="text" inputmode="decimal" placeholder="e.g. 55" value="' + esc(c.monthlyPremium) + '" data-action="cov-premium" data-id="' + m.id + '" />' +
            '<div class="helptext">Combined across everything selected above — optional, for your own reference.</div>' +
          '</div>'
        ) : "") +
      '</div>' +
      renderNav()
    );
  }

  /* --------- Step 3: needs questionnaire --------- */

  function renderStep3(){
    var m = currentTabMember(3);
    ensureMemberData(m.id);
    var n = state.needs[m.id];

    var comfortOptions = [
      ["general", "General ward"],
      ["semi-private", "Semi-private room"],
      ["private", "Private room"]
    ];
    var travelOptions = [
      ["rarely", "Rarely travel abroad"],
      ["sometimes", "A few trips a year"],
      ["often", "Frequent traveller"]
    ];

    function selectHtml(action, id, opts, current){
      return '<select id="' + action + '-' + id + '" data-action="' + action + '" data-id="' + id + '">' + opts.map(function(o){
        return '<option value="' + o[0] + '" ' + (current === o[0] ? "selected" : "") + '>' + o[1] + '</option>';
      }).join("") + '</select>';
    }

    return (
      '<div class="card">' +
        '<h2>Health &amp; lifestyle needs</h2>' +
        '<p class="lede">A few questions per person so we can match coverage that actually pays out for how you live.</p>' +
        renderMemberTabs(3) +

        '<div class="row2">' +
          '<div class="field">' +
            '<label for="need-gymSpend-' + m.id + '">Annual gym / fitness spend (CHF)</label>' +
            '<input id="need-gymSpend-' + m.id + '" type="text" inputmode="decimal" value="' + esc(n.gymSpend) + '" data-action="need-gymSpend" data-id="' + m.id + '" />' +
          '</div>' +
          '<div class="field">' +
            '<label for="need-glassesSpend-' + m.id + '">Glasses / contact lenses, next 2 years (CHF)</label>' +
            '<input id="need-glassesSpend-' + m.id + '" type="text" inputmode="decimal" value="' + esc(n.glassesSpend) + '" data-action="need-glassesSpend" data-id="' + m.id + '" />' +
          '</div>' +
        '</div>' +

        '<div class="row2">' +
          '<div class="field">' +
            '<label for="need-altMedSpend-' + m.id + '">Alternative medicine spend / year (CHF)</label>' +
            '<input id="need-altMedSpend-' + m.id + '" type="text" inputmode="decimal" value="' + esc(n.altMedSpend) + '" data-action="need-altMedSpend" data-id="' + m.id + '" />' +
            '<div class="helptext">Osteopathy, homeopathy, acupuncture, TCM…</div>' +
          '</div>' +
          '<div class="field">' +
            '<label for="need-comfortPref-' + m.id + '">Hospital comfort preference</label>' +
            selectHtml("need-comfortPref", m.id, comfortOptions, n.comfortPref) +
          '</div>' +
        '</div>' +

        '<div class="field" style="max-width:280px;">' +
          '<label for="need-travelFrequency-' + m.id + '">Travel abroad</label>' +
          selectHtml("need-travelFrequency", m.id, travelOptions, n.travelFrequency) +
        '</div>' +

        '<div class="field" style="max-width:280px;">' +
          '<label id="pregnancy-label-' + m.id + '">Planning a pregnancy in the next year?</label>' +
          '<div class="toggle-row" role="radiogroup" aria-labelledby="pregnancy-label-' + m.id + '">' +
            '<div class="toggle-btn ' + (!n.pregnancy ? "active" : "") + '" role="radio" aria-checked="' + (!n.pregnancy) + '" tabindex="0" data-action="need-pregnancy" data-id="' + m.id + '" data-value="false">No</div>' +
            '<div class="toggle-btn ' + (n.pregnancy ? "active" : "") + '" role="radio" aria-checked="' + n.pregnancy + '" tabindex="0" data-action="need-pregnancy" data-id="' + m.id + '" data-value="true">Yes</div>' +
          '</div>' +
          (n.pregnancy ? '<div class="helptext" style="margin-top:8px;">Most plans only pay maternity benefits after a waiting period of about 12 months from when the policy started — the figures below assume that period has already passed. If you\'re switching insurer specifically because of this pregnancy, check the waiting period first; it may not pay out in time.</div>' : "") +
        '</div>' +
      '</div>' +
      renderNav()
    );
  }

  function renderNav(){
    return (
      '<div class="nav-row">' +
        '<button class="btn btn-ghost" data-action="back">Back</button>' +
        '<button class="btn btn-primary" data-action="next">Continue</button>' +
      '</div>'
    );
  }

  /* --------- Step 4: results --------- */

  function renderStep4(){
    var h = state.household;
    var results = h.members.map(function(m){
      ensureMemberData(m.id);
      var rec = recommendForPerson(m, state.needs[m.id]);
      return { member: m, rec: rec, coverage: state.coverage[m.id] };
    });

    var totalReimb = results.reduce(function(sum, r){ return sum + r.rec.best.reimbursement; }, 0);
    var sourcedCount = INSURERS.filter(function(i){ return i.sourced; }).length;

    var html = "";
    html += (
      '<div class="disclaimer">' +
        '<span class="ico">&#9888;</span>' +
        '<span>Plan names and reimbursement figures for ' + sourcedCount + ' of ' + INSURERS.length + ' insurers (Groupe Mutuel, Helsana, CSS, Sanitas, Swica) come from their own official 2025/26 brochures and conditions — flagged per plan where a brochure summarized rather than itemized a figure. ' +
        'Atupri has no official documents yet and is marked <b>estimated, unverified</b>. ' +
        '<b>Premiums are never estimated here</b> — postal code, date of birth and sex are collected only so you can enter them straight into each insurer\'s own calculator for a binding quote.</span>' +
      '</div>'
    );

    html += '<div class="card">';
    html += (
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">' +
        '<div><h2>Household summary</h2><p class="lede" style="margin-bottom:0;">Based on the plan that best covers each member\'s stated needs.</p></div>' +
        '<button class="btn btn-ghost btn-sm no-print" data-action="print-pdf">Download / print PDF</button>' +
      '</div>'
    );
    html += (
      '<div class="summary-strip">' +
        '<div class="summary-tile"><div class="label">Household members</div><div class="value">' + h.members.length + '</div></div>' +
        '<div class="summary-tile"><div class="label">Est. total annual reimbursement</div><div class="value good">' + chf(totalReimb) + '</div></div>' +
        '<div class="summary-tile"><div class="label">Insurers officially sourced</div><div class="value">' + sourcedCount + ' / ' + INSURERS.length + '</div></div>' +
      '</div>'
    );
    html += '</div>';

    results.forEach(function(r){
      html += renderPersonResult(r);
    });

    html += (
      '<div class="restart-row">' +
        '<button data-action="restart">Start over</button>' +
      '</div>' +
      '<div class="nav-row">' +
        '<button class="btn btn-ghost" data-action="back">Back</button>' +
        '<span></span>' +
      '</div>'
    );

    return html;
  }

  function renderPersonResult(r){
    var m = r.member, rec = r.rec, coverage = r.coverage;
    var age = rec.age;
    var ageStr = age === null ? "" : (age + "y · " + rec.band);
    var h = state.household;
    var region = regionFromPostal(h.postalCode);

    var currentAnnualPremium = null;
    if (coverage && coverage.hasComplementary){
      var monthlyNum = parseFloat(coverage.monthlyPremium);
      if (!isNaN(monthlyNum) && monthlyNum > 0) currentAnnualPremium = monthlyNum * 12;
    }

    var detailsBits = [];
    if (m.birthDate) detailsBits.push("born " + m.birthDate);
    if (m.sex) detailsBits.push(m.sex === "f" ? "female" : "male");
    if (h.postalCode) detailsBits.push("NPA " + h.postalCode);
    var quoteDetailsHtml = detailsBits.length
      ? '<div class="helptext" style="margin:2px 0 14px;">For each insurer\'s own calculator: ' + esc(detailsBits.join(", ")) + '</div>'
      : "";

    var currentCoverageHtml = "";
    if (coverage && coverage.hasComplementary){
      var currentBits = [];
      var currentInsurer = coverage.insurerId ? INSURERS.filter(function(i){ return i.id === coverage.insurerId; })[0] : null;
      if (currentInsurer) currentBits.push(currentInsurer.name);
      else if (coverage.insurerId === "other") currentBits.push("other insurer");
      if (coverage.planNames && coverage.planNames.length) currentBits.push(coverage.planNames.join(", "));
      currentCoverageHtml = (
        '<div class="helptext" style="margin:2px 0 14px;">' +
          'Currently has' + (currentBits.length ? ": " + esc(currentBits.join(" — ")) : " complementary insurance") +
          (currentAnnualPremium !== null ? ' (' + chf(currentAnnualPremium) + '/yr)' : '') +
        '</div>'
      );
    }

    // Every candidate needs a quote-form entry before we can look up its net
    // cost, since ranking runs before the cards themselves are rendered.
    rec.top3.forEach(function(c){ ensureQuoteFormEntry(m.id, c.insurerId, c.tierLabel); });

    var ranked = rec.top3.map(function(c){
      return {
        candidate: c,
        netCost: getCandidateNetCost(m, c.insurerId, rec.band, region),
        isOriginalBest: c.insurerId === rec.best.insurerId
      };
    });
    var anyKnownCost = ranked.some(function(x){ return x.netCost; });
    if (anyKnownCost){
      ranked.sort(function(a, b){
        var aKnown = !!a.netCost, bKnown = !!b.netCost;
        if (aKnown && bKnown) return a.netCost.netAnnual - b.netCost.netAnnual;
        if (aKnown !== bKnown) return aKnown ? -1 : 1;
        return 0;
      });
    }

    var tagLabel = anyKnownCost ? "BEST VALUE" : "BEST MATCH";
    var comparisonRows = buildTierTable(ranked.map(function(x){ return x.candidate; }), 0, tagLabel);
    var candidatesHtml = ranked.map(function(entry, idx){
      return renderCandidateCard(m, entry.candidate, idx, rec.band, region, entry.netCost, entry.isOriginalBest, anyKnownCost, currentAnnualPremium);
    }).join("");

    var costCaveatHtml = anyKnownCost ? "" : (
      '<div class="disclaimer" style="margin:14px 0 0;">' +
        '<span class="ico">&#9888;</span>' +
        '<span>"Best match" ranks by coverage fit only — it has no idea what any of these plans actually cost. ' +
        'A plan that covers more categories almost always carries a higher premium, so it can easily be the ' +
        'wrong choice if your needs are narrow (e.g. glasses only). Enter a real premium in a card below — ' +
        'yours or from the community — to switch this to a genuine "best value" ranking by net annual cost.</span>' +
      '</div>'
    );

    // Cards reorder visually when a price is entered and the ranking
    // switches from match-based to value-based, but nothing tells a
    // screen-reader user that happened. Appending to the module-level
    // pendingLiveAnnouncement (flushed to a persistent #live-region node
    // at the end of render()) rather than embedding this inline: a live
    // region has to be the SAME DOM node across updates for most screen
    // readers to announce it, and app.innerHTML replacement destroys and
    // recreates everything on every render, so an inline live region here
    // would never reliably fire.
    pendingLiveAnnouncement += (pendingLiveAnnouncement ? " " : "") +
      (m.name || "This household member") + ': ranked by ' + (anyKnownCost ? "best value (net annual cost)" : "best coverage match") +
      ' — #1 is ' + ranked[0].candidate.insurerName + ' — ' + ranked[0].candidate.planName + '.';

    return (
      '<div class="person-result">' +
        '<div class="person-result-head">' +
          '<div>' +
            '<div class="person-name">' + esc(m.name || "Household member") + '</div>' +
            '<div class="person-meta">' + esc(ageStr) + '</div>' +
          '</div>' +
        '</div>' +

        quoteDetailsHtml +
        currentCoverageHtml +
        costCaveatHtml +

        '<div class="tier-table-wrap">' +
          '<table class="tier-table">' +
            '<thead><tr>' +
              '<th>Coverage</th>' +
              comparisonRows.headerCells +
            '</tr></thead>' +
            '<tbody>' + comparisonRows.bodyRows + '</tbody>' +
          '</table>' +
        '</div>' +

        candidatesHtml +
      '</div>'
    );
  }

  function renderCandidateCard(m, candidate, idx, band, region, netCost, isOriginalBest, anyKnownCost, currentAnnualPremium){
    var rankLabel;
    if (anyKnownCost) rankLabel = idx === 0 ? "#1 · Best value" : ("#" + (idx + 1));
    else rankLabel = idx === 0 ? "#1 · Best match" : ("#" + (idx + 1));

    var originalBestNote = (isOriginalBest && idx !== 0)
      ? '<div class="helptext" style="margin:-6px 0 12px;">This was the closest coverage match to your stated needs — see net cost below for how it compares on price.</div>'
      : "";

    var savingsHtml = "";
    if (netCost && currentAnnualPremium !== null){
      var savings = currentAnnualPremium - netCost.netAnnual;
      var savingsCls = savings > 0 ? "pos" : (savings < 0 ? "neg" : "");
      var savingsLabel = savings > 0
        ? ('▾ Roughly ' + chf(savings) + '/yr less than what you currently pay in premium')
        : (savings < 0
            ? ('▴ Roughly ' + chf(-savings) + '/yr more than what you currently pay in premium')
            : 'About the same as what you currently pay in premium');
      savingsHtml = (
        '<div class="savings-note ' + savingsCls + '">' + savingsLabel + '</div>' +
        '<div class="helptext" style="margin:-6px 0 10px;">Compares this plan\'s net cost to your reported current premium — not netted against what your current plan itself reimburses, since we don\'t model that.</div>'
      );
    }

    var reimbursementToShow = netCost ? netCost.reimbursement : candidate.reimbursement;
    var breakdownSource = netCost ? netCost.breakdown : candidate.breakdown;

    var breakdownChips = [];
    if (breakdownSource.altMed > 0) breakdownChips.push(["Alt. medicine", breakdownSource.altMed]);
    if (breakdownSource.glasses > 0) breakdownChips.push(["Glasses", breakdownSource.glasses]);
    if (breakdownSource.gym > 0) breakdownChips.push(["Gym/fitness", breakdownSource.gym]);
    if (breakdownSource.maternity > 0) breakdownChips.push(["Maternity", breakdownSource.maternity]);
    var chipsHtml = breakdownChips.length
      ? '<div class="breakdown-list">' + breakdownChips.map(function(c){
          return '<span class="chip">' + c[0] + ' <b>' + chf(c[1]) + '/yr</b></span>';
        }).join("") + '</div>'
      : '<div class="helptext" style="margin:10px 0;">No specific ambulatory needs entered — this reflects a baseline match.</div>';

    var sourceNote = candidate.insurerSourced
      ? '<span class="helptext">Sourced from ' + esc(candidate.insurerSourceLabel) + '.' +
        (candidate.tierData.approx ? ' <span class="approx-badge" title="This plan has one or more figures that had to be approximated from the source documents rather than read off directly — see full plan details below.">~ figure approximated</span>' : "") +
        '</span>'
      : '<span class="helptext" style="color:var(--warn);">Estimated, unverified — ' + esc(candidate.insurerSourceLabel) + '</span>';

    var mismatchHtml = "";
    if (!candidate.passes){
      var memberNeeds = state.needs[m.id];
      mismatchHtml = (
        '<div class="disclaimer" style="margin-bottom:14px;">' +
          '<span class="ico">&#9888;</span>' +
          '<span>This plan doesn\'t cover a ' + esc(memberNeeds.comfortPref) + ' ward' +
          '. You\'d likely need to combine it with a separate hospital-comfort upgrade to get full coverage.</span>' +
        '</div>'
      );
    }

    var unsourcedTopHtml = "";
    if (idx === 0 && !candidate.insurerSourced){
      unsourcedTopHtml = (
        '<div class="disclaimer" style="margin-bottom:14px;">' +
          '<span class="ico">&#9888;</span>' +
          '<span><b>This top result is an unverified estimate</b>, not a figure from ' + esc(candidate.insurerName) + '\'s own documents — ' +
          esc(candidate.insurerSourceLabel) + '. Treat it as a placeholder and confirm directly with ' + esc(candidate.insurerName) + ' before deciding.</span>' +
        '</div>'
      );
    }

    var communityHtml = renderCommunityBox(m, candidate, band, region);
    var detailsHtml = renderPlanDetails(candidate);

    var metricCells = '<div class="metric"><div class="k">Est. annual reimbursement for your stated needs</div><div class="v" style="color:var(--success)">' + chf(reimbursementToShow) + '</div></div>';
    if (netCost && netCost.source === "yours"){
      metricCells += '<div class="metric"><div class="k">Your net annual cost</div><div class="v" style="color:' + (netCost.netAnnual <= 0 ? "var(--success)" : "var(--text)") + '">' + chf(netCost.netAnnual) + '</div></div>';
    }

    return (
      '<div class="candidate-card">' +
        '<div class="person-result-head">' +
          '<span class="rank-pill">' + rankLabel + '</span>' +
          '<div class="rec-badge">' + esc(candidate.insurerName) + ' — ' + esc(candidate.planName) + (candidate.insurerSourced ? "" : " (estimated)") + '</div>' +
        '</div>' +

        originalBestNote +
        unsourcedTopHtml +
        mismatchHtml +

        '<div class="metric-row" style="grid-template-columns:' + (netCost && netCost.source === "yours" ? "1fr 1fr" : "1fr") + ';">' +
          metricCells +
        '</div>' +

        savingsHtml +
        chipsHtml +
        '<div style="margin-bottom:10px;">' + sourceNote + '</div>' +

        '<a class="quote-link" href="' + candidate.insurerUrl + '" target="_blank" rel="noopener noreferrer">' +
          'Get your exact premium on ' + esc(candidate.insurerName) + '\'s calculator →' +
        '</a>' +

        detailsHtml +
        communityHtml +
      '</div>'
    );
  }

  function renderPlanDetails(candidate){
    var insurer = INSURERS.filter(function(i){ return i.id === candidate.insurerId; })[0];
    var noteHtml = candidate.tierData.note
      ? '<p class="detail-note"><b>About this plan:</b> ' + esc(candidate.tierData.note) + '</p>'
      : "";

    var otherHtml = "";
    if (insurer && insurer.knownPlanGroups){
      var groupsHtml = insurer.knownPlanGroups.map(function(g){
        var items = g.items.filter(function(label){ return label !== candidate.planName; });
        if (!items.length) return "";
        return (
          '<div class="detail-group-label">' + esc(g.group || "Other") + '</div>' +
          '<div class="detail-plan-list">' + items.map(function(l){ return '<span class="chip">' + esc(l) + '</span>'; }).join("") + '</div>'
        );
      }).join("");
      if (groupsHtml){
        otherHtml = '<p class="detail-note" style="margin-top:14px;"><b>' + esc(insurer.name) + '</b> also sells these separately (not modeled in the comparison above):</p>' + groupsHtml;
      }
    }

    if (!noteHtml && !otherHtml) return "";
    return (
      '<details class="plan-details">' +
        '<summary>Full plan details &amp; other ' + esc(candidate.insurerName) + ' products</summary>' +
        noteHtml + otherHtml +
      '</details>'
    );
  }

  function findTierData(insurerId, tierLabel){
    var insurer = INSURERS.filter(function(i){ return i.id === insurerId; })[0];
    if (!insurer) return null;
    return insurer.tiers.filter(function(t){ return t.tier === tierLabel; })[0] || null;
  }

  // Net annual cost for a candidate = premium - reimbursement. Prefers the
  // household's own reported premium (most authoritative); falls back to the
  // community median once enough real quotes exist for that plan/age/region.
  // Returns null when neither is known yet, so ranking can leave that
  // candidate in its original match-based position.
  // Single source of truth for "premium minus reimbursement" for one
  // insurer's community-reported quotes — used both to rank candidates
  // (getCandidateNetCost) and to render the community-pricing box, so the
  // two can never drift into disagreeing about the same number.
  function getCommunityNetCost(m, insurerId, tierLabel, band, region){
    var community = state.community[insurerId];
    if (!community || community.status !== "loaded" || !region) return null;
    var tierData = findTierData(insurerId, tierLabel);
    if (!tierData) return null;
    var prelim = computePreliminary(community.rows, insurerId, tierLabel, band, region);
    if (!prelim) return null;
    var reimb = computeReimbursement(state.needs[m.id], tierData);
    var annualPremium = prelim.median * 12;
    return {
      medianMonthly: prelim.median, count: prelim.count,
      annualPremium: annualPremium, netAnnual: annualPremium - reimb.total,
      reimbursement: reimb.total, breakdown: reimb.breakdown
    };
  }

  function getCandidateNetCost(m, insurerId, band, region){
    var qf = state.quoteForm[m.id] && state.quoteForm[m.id][insurerId];
    if (!qf) return null;
    var tierData = findTierData(insurerId, qf.tier);
    if (!tierData) return null;

    var ownPremium = parseFloat(qf.premium);
    if (!isNaN(ownPremium) && ownPremium > 0){
      var reimb = computeReimbursement(state.needs[m.id], tierData);
      var annual = ownPremium * 12;
      return { annualPremium: annual, netAnnual: annual - reimb.total, reimbursement: reimb.total, breakdown: reimb.breakdown, source: "yours" };
    }

    var communityResult = getCommunityNetCost(m, insurerId, qf.tier, band, region);
    if (communityResult){
      communityResult.source = "community";
      return communityResult;
    }
    return null;
  }

  var DRIVE_ERROR_COPY = {
    needs_reauth: "Your Google Drive connection needs to be reconnected — go to claude.ai Settings → Connectors.",
    server_not_connected: "Connect Google Drive in claude.ai Settings → Connectors to save or see community pricing.",
    selection_required: "Choose which Google account to use in the connector picker, then try again.",
    blocked_by_policy: "Your organization's policy blocks this connector.",
    approval_required: "This action needs approval before it can run.",
    not_granted: "This page doesn't have permission to use connectors in this view.",
    capability_disabled: "Connector access isn't available in this view.",
    server_unavailable: "Google Drive is temporarily unreachable — try again in a moment."
  };

  function driveErrorMessage(code){
    return DRIVE_ERROR_COPY[code] || "Couldn't reach Google Drive right now.";
  }

  function renderCommunityBox(m, candidate, band, region){
    var insurerId = candidate.insurerId;
    var qf = ensureQuoteFormEntry(m.id, insurerId, candidate.tierLabel);

    if (!mcpAvailable()){
      return (
        '<div class="community-box no-print">' +
          '<h4>Community-sourced pricing</h4>' +
          '<div class="helptext">' + DRIVE_ERROR_COPY.server_not_connected + '</div>' +
        '</div>'
      );
    }

    ensureCommunityLoaded(insurerId);
    var community = state.community[insurerId] || { status: "idle", rows: [] };
    var insurer = INSURERS.filter(function(i){ return i.id === insurerId; })[0];
    var tierOptions = insurer ? insurer.tiers.map(function(t){
      return '<option value="' + esc(t.tier) + '" ' + (qf.tier === t.tier ? "selected" : "") + '>' + esc(t.planName) + '</option>';
    }).join("") : "";

    // Loading/error/not-enough-data states are all just "nothing to show
    // yet" — worth a nudge on screen, meaningless on paper (a printed page
    // can't act on "connect Google Drive in Settings"), so those variants
    // are no-print; only an actual computed preliminary price is kept.
    var prelimHtml = "";
    if (community.status === "loading"){
      prelimHtml = '<div class="helptext no-print">Loading community data…</div>';
    } else if (community.status === "error"){
      prelimHtml = '<div class="status-msg err no-print">' + esc(driveErrorMessage(community.errorCode)) + '</div>';
    } else if (community.status === "loaded"){
      var bucketRows = region ? community.rows.filter(function(r){
        return r.insurerId === insurerId && r.tier === qf.tier && r.ageBand === band && r.region === region;
      }) : [];
      var communityNet = getCommunityNetCost(m, insurerId, qf.tier, band, region);
      if (communityNet){
        prelimHtml = (
          '<div class="prelim">' + chf(communityNet.medianMonthly) + '/mo preliminary</div>' +
          '<div class="helptext">Median of ' + communityNet.count + ' real quotes reported for this plan, age band and region — not an official price.</div>' +
          '<div class="metric-row" style="grid-template-columns:1fr 1fr;margin-top:10px;">' +
            '<div class="metric"><div class="k">Est. annual premium</div><div class="v">' + chf(communityNet.annualPremium) + '</div></div>' +
            '<div class="metric"><div class="k">Est. real net annual cost</div><div class="v" style="color:' + (communityNet.netAnnual <= 0 ? "var(--success)" : "var(--text)") + '">' + chf(communityNet.netAnnual) + '</div></div>' +
          '</div>'
        );
      } else {
        prelimHtml = '<div class="helptext no-print">Not enough reported quotes yet for this plan/age/region (' + bucketRows.length + ' so far, need ' + PRELIM_THRESHOLD + ') — report yours below to help build it.</div>';
      }
    }

    var statusHtml = "";
    if (qf.status === "saving") statusHtml = '<div class="status-msg info no-print">Saving…</div>';
    else if (qf.status === "saved") statusHtml = '<div class="status-msg ok no-print">Saved — thank you, this helps future estimates.</div>';
    else if (qf.status === "error") statusHtml = '<div class="status-msg err no-print">' + esc(driveErrorMessage(qf.errorCode)) + '</div>';

    var hasPrintablePrelim = community.status === "loaded" && !!getCommunityNetCost(m, insurerId, qf.tier, band, region);

    return (
      '<div class="community-box' + (hasPrintablePrelim ? '' : ' no-print') + '">' +
        '<h4>Community-sourced pricing</h4>' +
        prelimHtml +
        '<div class="no-print">' +
          '<div class="section-title" style="margin:16px 0 8px;">Report your real quote for ' + esc(insurer ? insurer.name : insurerId) + '</div>' +
          '<div class="row2">' +
            '<div class="field" style="margin-bottom:8px;">' +
              '<label for="quote-tier-' + m.id + '-' + insurerId + '">Plan</label>' +
              '<select id="quote-tier-' + m.id + '-' + insurerId + '" data-action="quote-tier" data-id="' + m.id + '" data-insurer="' + insurerId + '">' + tierOptions + '</select>' +
            '</div>' +
            '<div class="field" style="margin-bottom:8px;">' +
              '<label for="quote-premium-' + m.id + '-' + insurerId + '">Monthly premium (CHF)</label>' +
              '<input id="quote-premium-' + m.id + '-' + insurerId + '" type="text" inputmode="decimal" placeholder="e.g. 62.40" value="' + esc(qf.premium) + '" data-action="quote-premium" data-id="' + m.id + '" data-insurer="' + insurerId + '" />' +
            '</div>' +
          '</div>' +
          '<button class="btn btn-primary btn-sm" data-action="quote-save" data-id="' + m.id + '" data-insurer="' + insurerId + '" ' + (qf.premium && qf.status !== "saving" ? "" : "disabled") + '>Save quote</button>' +
          statusHtml +
        '</div>' +
      '</div>'
    );
  }

  function capLabel(cap){
    return cap >= 15000 ? "no published annual cap" : (chf(cap) + "/yr");
  }

  function buildTierTable(tiers, recommendedIdx, tagLabel){
    var headerCells = tiers.map(function(t, i){
      var hl = i === recommendedIdx ? "tier-col-highlight" : "";
      return (
        '<th class="' + hl + '">' +
          '<span class="tier-name">' + esc(t.insurerName) + ' — ' + esc(t.planName) + '</span>' +
          (i === recommendedIdx ? '<span class="tier-recommended-tag">' + esc(tagLabel || "BEST MATCH") + '</span>' : "") +
        '</th>'
      );
    }).join("");

    function row(label, valueFn){
      var cells = tiers.map(function(t, i){
        var hl = i === recommendedIdx ? "tier-col-highlight" : "";
        return '<td class="' + hl + '">' + valueFn(t) + '</td>';
      }).join("");
      return '<tr><td>' + label + '</td>' + cells + '</tr>';
    }

    var bodyRows = "";
    bodyRows += row("Alternative medicine", function(t){
      return t.tierData.altMed.cap === 0 ? "Not covered" : (t.tierData.altMed.percent + "% up to " + capLabel(t.tierData.altMed.cap));
    });
    bodyRows += row("Glasses / lenses", function(t){
      return t.tierData.glasses.amount === 0 ? "Not covered" : (chf(t.tierData.glasses.amount) + " / " + t.tierData.glasses.periodYears + "yr" + (t.tierData.glasses.periodYears > 1 ? "s" : ""));
    });
    bodyRows += row("Gym / fitness", function(t){
      return t.tierData.gym.cap === 0 ? "Not covered" : (t.tierData.gym.percent + "% up to " + chf(t.tierData.gym.cap) + "/yr");
    });
    bodyRows += row("Hospital comfort", function(t){
      return COMFORT_LABEL[t.tierData.hospitalComfort];
    });
    bodyRows += row("Maternity", function(t){
      return t.tierData.maternity.amount > 0 ? chf(t.tierData.maternity.amount) + " lump sum" : "Covered as ordinary treatment";
    });
    bodyRows += row("Travel / emergency abroad", function(t){
      return t.tierData.travel ? "Included" : "—";
    });

    return { headerCells: headerCells, bodyRows: bodyRows };
  }

  /* ------------------------------ handlers ------------------------------ */

  function attachHandlers(){
    var app = document.getElementById("app");

    app.querySelectorAll('[data-action="postal-code"]').forEach(function(el){
      el.addEventListener("input", function(){
        state.household.postalCode = el.value.replace(/\D/g, "").slice(0, 4);
        render();
        focusEl('[data-action="postal-code"]', true);
      });
    });

    app.querySelectorAll('[data-action="member-name"]').forEach(function(el){
      el.addEventListener("input", function(){
        var id = el.getAttribute("data-id");
        var m = findMember(id);
        if (m) m.name = el.value;
        render();
        focusEl('[data-action="member-name"][data-id="' + id + '"]', true);
      });
    });

    app.querySelectorAll('[data-action="member-birthdate"]').forEach(function(el){
      // Chromium fires "input"/"change" on this field as soon as it has SOME
      // parseable value — e.g. after just the first digit of the year, long
      // before the user is done typing. Re-rendering (which replaces this
      // input's DOM node) on those events wipes the browser's in-progress
      // per-segment typing state. So we track the value live but only
      // re-render once the user actually leaves the field.
      el.addEventListener("input", function(){
        var id = el.getAttribute("data-id");
        var m = findMember(id);
        if (m) m.birthDate = el.value;
      });
      el.addEventListener("blur", function(){
        render();
      });
    });

    app.querySelectorAll('[data-action="member-sex"]').forEach(function(el){
      el.addEventListener("change", function(){
        var id = el.getAttribute("data-id");
        var m = findMember(id);
        if (m) m.sex = el.value;
        render();
      });
    });

    app.querySelectorAll('[data-action="add-member"]').forEach(function(el){
      el.addEventListener("click", function(){
        var m = newMember("");
        state.household.members.push(m);
        ensureMemberData(m.id);
        render();
      });
    });

    app.querySelectorAll('[data-action="remove-member"]').forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-id");
        state.household.members = state.household.members.filter(function(m){ return m.id !== id; });
        delete state.coverage[id];
        delete state.needs[id];
        if (state.activeTab[2] === id) state.activeTab[2] = state.household.members[0].id;
        if (state.activeTab[3] === id) state.activeTab[3] = state.household.members[0].id;
        render();
      });
    });

    app.querySelectorAll('[data-action="tab"]').forEach(function(el){
      el.addEventListener("click", function(){
        var step = el.getAttribute("data-step");
        var id = el.getAttribute("data-id");
        state.activeTab[step] = id;
        render();
      });
    });

    app.querySelectorAll('[data-action="cov-has"]').forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-id");
        state.coverage[id].hasComplementary = el.getAttribute("data-value") === "true";
        render();
      });
    });

    app.querySelectorAll('[data-action="cov-insurer"]').forEach(function(el){
      el.addEventListener("change", function(){
        var id = el.getAttribute("data-id");
        state.coverage[id].insurerId = el.value;
        state.coverage[id].planNames = [];
        render();
      });
    });
    app.querySelectorAll('[data-action="cov-plan-toggle"]').forEach(function(el){
      el.addEventListener("change", function(){
        var id = el.getAttribute("data-id");
        var value = el.getAttribute("data-value");
        var list = state.coverage[id].planNames;
        var idx = list.indexOf(value);
        if (el.checked && idx === -1) list.push(value);
        if (!el.checked && idx !== -1) list.splice(idx, 1);
        render();
      });
    });
    app.querySelectorAll('[data-action="cov-plan-text"]').forEach(function(el){
      el.addEventListener("input", function(){
        var id = el.getAttribute("data-id");
        state.coverage[id].planNames = el.value ? [el.value] : [];
        render();
        focusEl('[data-action="cov-plan-text"][data-id="' + id + '"]', true);
      });
    });
    bindTextInput("cov-premium", function(id, val){ state.coverage[id].monthlyPremium = sanitizeDecimal(val); }, "input");

    app.querySelectorAll('[data-action="need-pregnancy"]').forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-id");
        state.needs[id].pregnancy = el.getAttribute("data-value") === "true";
        render();
      });
    });

    ["gymSpend", "glassesSpend", "altMedSpend"].forEach(function(field){
      bindTextInput("need-" + field, function(id, val){
        // Store the sanitized string as typed, not a parsed/clamped number —
        // coercing to a number on every keystroke fights the user's cursor
        // and forces the field back to "0" the moment it's cleared to retype.
        // computeReimbursement()'s arithmetic coerces this string for us.
        state.needs[id][field] = sanitizeDecimal(val);
      }, "input");
    });
    bindTextInput("need-comfortPref", function(id, val){ state.needs[id].comfortPref = val; }, "change");
    bindTextInput("need-travelFrequency", function(id, val){ state.needs[id].travelFrequency = val; }, "change");

    app.querySelectorAll('[data-action="next"]').forEach(function(el){
      el.addEventListener("click", function(){
        if (state.step === 1 && !isStep1Valid()) return;
        state.step = Math.min(4, state.step + 1);
        window.scrollTo(0, 0);
        render();
      });
    });
    app.querySelectorAll('[data-action="back"]').forEach(function(el){
      el.addEventListener("click", function(){
        state.step = Math.max(1, state.step - 1);
        window.scrollTo(0, 0);
        render();
      });
    });
    app.querySelectorAll('[data-action="quote-tier"]').forEach(function(el){
      el.addEventListener("change", function(){
        var id = el.getAttribute("data-id");
        var insurerId = el.getAttribute("data-insurer");
        state.quoteForm[id][insurerId].tier = el.value;
        render();
      });
    });

    app.querySelectorAll('[data-action="quote-premium"]').forEach(function(el){
      el.addEventListener("input", function(){
        var id = el.getAttribute("data-id");
        var insurerId = el.getAttribute("data-insurer");
        state.quoteForm[id][insurerId].premium = sanitizeDecimal(el.value);
        render();
        focusEl('[data-action="quote-premium"][data-id="' + id + '"][data-insurer="' + insurerId + '"]', true);
      });
    });

    app.querySelectorAll('[data-action="quote-save"]').forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-id");
        var insurerId = el.getAttribute("data-insurer");
        var qf = state.quoteForm[id][insurerId];
        var m = findMember(id);
        var premiumNum = parseFloat(qf.premium);
        if (!m || !qf.tier || isNaN(premiumNum) || premiumNum <= 0) return;
        var age = computeAge(m.birthDate);
        var band = ageBand(age);
        var region = regionFromPostal(state.household.postalCode);
        qf.status = "saving";
        qf.errorCode = "";
        render();
        saveQuoteRow(insurerId, {
          timestamp: new Date().toISOString(),
          insurerId: insurerId,
          tier: qf.tier,
          planName: (findTierData(insurerId, qf.tier) || {}).planName || "",
          ageBand: band,
          sex: m.sex,
          region: region,
          postalCode: state.household.postalCode,
          monthlyPremiumCHF: premiumNum
        }).then(function(rows){
          qf.status = "saved";
          // A successful save proves Drive is reachable and gives us fresh
          // rows — if this box had previously failed to load, that stale
          // "error" status would otherwise keep showing forever even though
          // we now have current data in hand.
          if (state.community[insurerId]){
            state.community[insurerId].status = "loaded";
            state.community[insurerId].errorCode = "";
            state.community[insurerId].rows = rows;
          }
          render();
        }).catch(function(err){
          qf.status = "error";
          qf.errorCode = (err && err.code) || "upstream_error";
          render();
        });
      });
    });

    app.querySelectorAll('[data-action="restart"]').forEach(function(el){
      el.addEventListener("click", function(){
        if (confirm("Start over? This clears everything you entered.")){
          state = defaultState();
          window.scrollTo(0, 0);
          render();
        }
      });
    });

    app.querySelectorAll('[data-action="print-pdf"]').forEach(function(el){
      el.addEventListener("click", function(){ window.print(); });
    });

    function bindTextInput(action, setter, evt){
      app.querySelectorAll('[data-action="' + action + '"]').forEach(function(el){
        el.addEventListener(evt, function(){
          var id = el.getAttribute("data-id");
          setter(id, el.value);
          render();
          if (evt === "input") focusEl('[data-action="' + action + '"][data-id="' + id + '"]', true);
        });
      });
    }

    function focusEl(selector, placeAtEnd){
      var el = app.querySelector(selector);
      if (el){
        el.focus();
        if (placeAtEnd && el.setSelectionRange && typeof el.value === "string"){
          var len = el.value.length;
          try { el.setSelectionRange(len, len); } catch(e){}
        }
      }
    }

    function findMember(id){
      return state.household.members.filter(function(m){ return m.id === id; })[0];
    }
  }

  render();

  // .toggle-btn and .tab are plain divs (not <button>/<input>) so they can
  // carry custom active-state styling without fighting native control
  // chrome, but that means keyboard users get nothing by default — no
  // built-in Enter/Space activation. Bound once on the outer #app element
  // (which render() never replaces — only its innerHTML) rather than
  // per-render, since attachHandlers() rebinds every other listener from
  // scratch on every render and doing that here would stack duplicate
  // listeners.
  document.getElementById("app").addEventListener("keydown", function(e){
    if (e.key !== "Enter" && e.key !== " " && e.key !== "Spacebar") return;
    var target = e.target.closest && e.target.closest(".toggle-btn, .tab");
    if (!target) return;
    e.preventDefault();
    target.click();
  });

  // Native <details> hides its content whenever collapsed, and that can't
  // be reliably forced open with CSS alone across browsers (Chromium's
  // closed-details rendering isn't just display:none). Force every plan's
  // full-detail block open for the duration of printing instead, and
  // restore whatever was open before.
  var reopenAfterPrint = [];
  window.addEventListener("beforeprint", function(){
    reopenAfterPrint = [];
    document.querySelectorAll(".plan-details").forEach(function(el){
      if (!el.open){ el.open = true; reopenAfterPrint.push(el); }
    });
  });
  window.addEventListener("afterprint", function(){
    reopenAfterPrint.forEach(function(el){ el.open = false; });
    reopenAfterPrint = [];
  });
})();
</script>
